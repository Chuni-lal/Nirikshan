<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIRIKSHAN - Scanner</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2300f2fe' d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z'/></svg>">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Abstract Background for Glassmorphism Depth -->
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav class="navbar">
        <div class="brand-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" alt="Gov Logo" class="gov-logo">
            <div class="brand-text">
                <span class="brand-title">NIRIKSHAN</span>
                <span class="brand-subtitle">Dept. of Consumer Affairs</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="/" class="active">
                <span class="icon"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span> Scanner
            </a>
            <a href="/dashboard">
                <span class="icon"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></span> Dashboard
            </a>
            <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme">
                <svg id="moon-icon" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
                <svg id="sun-icon" width="24" height="24" fill="currentColor" viewBox="0 0 24 24" style="display:none;"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/></svg>
            </button>
        </div>
    </nav>
    <script>
        const body = document.body;
        const moon = document.getElementById('moon-icon');
        const sun = document.getElementById('sun-icon');
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            moon.style.display = 'none'; sun.style.display = 'block';
        }
        document.getElementById('theme-toggle').addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                moon.style.display = 'none'; sun.style.display = 'block';
            } else {
                localStorage.setItem('theme', 'light');
                moon.style.display = 'block'; sun.style.display = 'none';
            }
        });
    </script>

    <div id="toast-container" class="toast-container"></div>

    <main class="container">
        <section class="upload-section">
            <div id="upload-area" class="upload-area glass-panel">
                <p class="upload-title">Scan Packaged Commodity</p>
                
                <div class="custom-name-container">
                    <input type="text" id="custom-filename" class="custom-input" placeholder="Enter Product Name (e.g. Lays 50g) - Optional">
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn primary-btn action-btn" id="camera-btn" title="Take a picture using device camera">
                        <span class="icon"><svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg></span> Take Photo
                    </button>
                    <button type="button" class="btn secondary-btn action-btn" id="gallery-btn" title="Upload from your device storage">
                        <span class="icon"><svg width="32" height="32" fill="currentColor" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></span> Browse Gallery
                    </button>
                </div>
                <p class="drag-text">Or drag and drop image here</p>
                <!-- capture="environment" forces the rear camera on mobile -->
                <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
                <input type="file" id="gallery-input" accept=".jpg, .jpeg, .png, .webp" hidden>
            </div>
        </section>

        <section class="preview-section glass-panel" id="preview-section" style="display: none; padding: 2rem;">
            <h3>Preview</h3>
            <img id="preview-img" src="" alt="Preview">
            <br>
            <button type="button" class="btn success-btn" id="scan-btn">Scan for Compliance</button>
        </section>

        <section class="loader-section glass-panel" id="loader-section" style="display: none; padding: 3rem; margin-top: 2rem;">
            <div class="spinner"></div>
            <p>Analyzing packaging label...</p>
        </section>

        <section class="results-section glass-panel" id="results-section" style="display: none; padding: 3rem; margin-top: 2rem;">
            <h3>Scan Results</h3>
            <div id="status-badge" class="badge"></div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Rules Checked</h4>
                    <span id="rules-checked">0</span>
                </div>
                <div class="stat-card success-card">
                    <h4>Passed</h4>
                    <span id="rules-passed">0</span>
                </div>
                <div class="stat-card error-card">
                    <h4>Failed</h4>
                    <span id="rules-failed">0</span>
                </div>
            </div>

            <h4>Detailed Rules</h4>
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Rule ID</th>
                        <th>Rule Name</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="rules-tbody"></tbody>
            </table>

            <h4>Violations</h4>
            <div id="violations-list" class="violations-list"></div>

            <div class="report-links">
                <a id="pdf-link" href="#" class="btn primary-btn" target="_blank">Download PDF Report</a>
                <a id="evidence-link" href="#" class="btn primary-btn" target="_blank">View Evidence</a>
            </div>
        </section>
    </main>

    <script src="/static/js/scanner.js"></script>
</body>
</html>
